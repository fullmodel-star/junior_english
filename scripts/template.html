<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7b5bd6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="國中英文題庫">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>國中英文題庫 · 內部版</title>
<style>
:root{
--bg:#f1eefb;--bg2:#e9e3f9;--card:#ffffff;--ink:#26224a;--mut:#6f6a86;--line:#ece8f8;
--brand:#7b5bd6;--brand2:#a48ee6;--accent:#efeafb;
--ok:#0e8f63;--okbg:#e7f7f0;--bad:#d63a50;--badbg:#fdeef0;--warn:#c47a00;
--gold:#e6960f;--goldbg:#fff3dd;
--hero:linear-gradient(135deg,#7b5bd6,#9d86e6);
--r:18px;--r2:14px;--r3:11px;
--sh:0 1px 3px rgba(40,30,90,.05),0 8px 22px rgba(40,30,90,.08);
--shg:0 6px 18px rgba(123,91,214,.28);}
@media(prefers-color-scheme:dark){:root{
--bg:#151228;--bg2:#1a1636;--card:#201b38;--ink:#ece7fb;--mut:#a79fc8;--line:#302a52;
--brand:#b6a2ee;--brand2:#ccbcf5;--accent:#241f42;
--ok:#2dd4a0;--okbg:#12352a;--bad:#ff8a95;--badbg:#3a1e26;--gold:#f5b843;--goldbg:#2e2410;
--hero:linear-gradient(135deg,#7b5bd6,#9d86e6);}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:linear-gradient(180deg,var(--bg),var(--bg2));background-attachment:fixed;
color:var(--ink);font-family:-apple-system,"Segoe UI","Noto Sans TC",system-ui,sans-serif;
line-height:1.6;overscroll-behavior-y:none;-webkit-text-size-adjust:100%}
#app{max-width:540px;margin:0 auto;min-height:100vh;padding:0 15px 104px}
h1,h2,h3,h4{margin:.2em 0;font-weight:800;letter-spacing:.2px}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
code{background:var(--accent);padding:1px 6px;border-radius:6px;font-size:.9em}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:17px;margin:13px 0}
.row{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:15px 16px;margin:11px 0;
box-shadow:var(--sh);display:flex;align-items:center;gap:13px;width:100%;text-align:left;transition:transform .12s}
.row:active{transform:scale(.985)}
.row .ava{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-size:22px;flex:none;background:var(--accent);color:var(--brand)}
.row .t{font-weight:800;font-size:16px}
.row .s{font-size:13px;color:var(--mut);margin-top:1px}
.row .chev{margin-left:auto;color:var(--mut);font-size:22px;flex:none}
.pill{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;background:var(--accent);color:var(--brand);font-weight:700;vertical-align:middle}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,var(--brand),var(--brand2));
color:#fff;padding:14px 18px;border-radius:14px;font-weight:800;width:100%;box-shadow:var(--shg);transition:transform .12s;min-height:48px}
.btn:active{transform:scale(.98)}
.btn.ghost{background:none;color:var(--brand);border:1.5px solid var(--brand);box-shadow:none}
.btn.sm{width:auto;padding:11px 16px;font-size:14px;border-radius:11px;min-height:44px}
.iconbtn{min-width:44px;min-height:44px;display:grid;place-items:center;border-radius:11px;font-size:20px;color:var(--mut)}
.top{position:sticky;top:0;background:var(--hero);color:#fff;padding:14px 15px;padding-top:calc(13px + env(safe-area-inset-top));margin:0 -15px 12px;border-radius:0 0 18px 18px;z-index:20;display:flex;align-items:center;gap:6px;box-shadow:0 5px 16px rgba(123,91,214,.24);text-shadow:0 1px 2px rgba(0,0,0,.12)}
.top .back{font-size:26px;color:#fff}
.top h2{font-size:20px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#fff}
.top .back:focus-visible{outline-color:#fff}
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{flex:1;padding:9px 0 7px;font-size:11px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:700;min-height:52px}
.tabbar button .ic{font-size:21px;line-height:1;transition:transform .15s}
.tabbar button.on{color:var(--brand)}
.tabbar button.on .ic{transform:translateY(-1px) scale(1.12)}
.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:14px;
padding:14px 15px;margin:10px 0;font-size:15.5px;transition:transform .1s,border-color .1s;min-height:52px}
.opt:active{transform:scale(.99)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt .k{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;background:var(--accent);color:var(--brand);font-weight:800;margin-right:10px;font-size:13px;vertical-align:middle}
.opt.ok .k{background:var(--ok);color:#fff;animation:pop .3s}.opt.bad .k{background:var(--bad);color:#fff}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
.stem{font-size:17.5px;font-weight:700;margin:4px 0 15px;white-space:pre-wrap;line-height:1.6}
.exp{background:var(--accent);border:1px solid var(--line);border-radius:13px;padding:12px 14px;margin-top:13px;font-size:14.5px;white-space:pre-wrap}
.psg{background:var(--accent);border:1px solid var(--line);border-radius:13px;padding:14px 16px;margin:11px 0;font-size:15.5px;white-space:pre-wrap;line-height:1.9}
.wd{cursor:pointer;border-bottom:1px dashed color-mix(in srgb,var(--gold) 60%,transparent);border-radius:2px;transition:background .1s}
.wd:active{background:color-mix(in srgb,var(--gold) 40%,transparent)}
.wd.saved{background:color-mix(in srgb,var(--gold) 26%,transparent);border-bottom-style:solid}
.muted{color:var(--mut)}.center{text-align:center}
.prog{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:7px 0}
.prog>i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));border-radius:99px;transition:width .5s}
input[type=password],input[type=text]{width:100%;padding:14px;border-radius:13px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.gate{max-width:400px;margin:0 auto;padding-top:11vh}
.lockbadge{font-size:56px;text-align:center;filter:drop-shadow(0 6px 14px rgba(67,56,202,.3))}
label.ck{display:flex;align-items:center;gap:9px;font-size:14px;color:var(--mut);margin:13px 2px}
label.ck input{width:19px;height:19px;accent-color:var(--brand)}
.note h4{margin:15px 0 4px;font-size:15.5px;color:var(--brand)}
.note ul{margin:6px 0;padding-left:20px}.note li{margin:3px 0}
.eg{font-style:italic;color:var(--mut);margin:3px 0;padding-left:10px;border-left:2px solid var(--line)}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(8px);background:#232842;color:#fff;
padding:10px 17px;border-radius:99px;font-size:14px;z-index:70;opacity:0;transition:.25s;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:88%}
.toast.on{opacity:.97;transform:translateX(-50%) translateY(0)}
.hero{background:var(--hero);color:#fff;border-radius:22px;padding:20px;margin:14px 0 6px;box-shadow:var(--shg);position:relative;overflow:hidden;text-shadow:0 1px 2px rgba(0,0,0,.18)}
.hero::after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.13)}
.hero .hi{font-size:14px;opacity:.95}.hero .big{font-size:23px;font-weight:800;margin:2px 0 12px}
.hero .streak{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.22);padding:5px 12px;border-radius:99px;font-weight:800;font-size:14px}
.ring{--p:0;width:76px;height:76px;border-radius:50%;flex:none;background:conic-gradient(#fff calc(var(--p)*1%),rgba(255,255,255,.28) 0);display:grid;place-items:center}
.ring>i{width:58px;height:58px;border-radius:50%;background:#4f46e5;display:grid;place-items:center;font-weight:800;font-size:14px;font-style:normal;line-height:1.1;text-align:center;text-shadow:none}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.tile{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:13px 8px;text-align:center;box-shadow:var(--sh)}
.tile .n{font-size:22px;font-weight:800;color:var(--brand)}.tile .l{font-size:12px;color:var(--mut);margin-top:1px}
.seg{display:flex;background:var(--accent);border-radius:12px;padding:4px;gap:4px;margin:12px 0}
.seg button{flex:1;padding:10px;border-radius:9px;font-size:13.5px;font-weight:700;color:var(--mut);min-height:44px}
.seg button.on{background:var(--card);color:var(--brand);box-shadow:var(--sh)}
.bars{display:flex;align-items:flex-end;gap:6px;height:80px;margin:12px 4px 4px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
.bars .b .bar{width:70%;max-width:26px;background:linear-gradient(180deg,var(--brand2),var(--brand));border-radius:6px 6px 3px 3px;min-height:3px;transition:height .5s}
.bars .b.today .bar{background:linear-gradient(180deg,var(--gold),#c47a00)}
.bars .b small{font-size:10px;color:var(--mut)}
.flash{min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 18px;cursor:pointer;width:100%}
.flash .word{font-size:34px;font-weight:800}
.badge{display:inline-flex;align-items:center;gap:6px;background:var(--accent);border-radius:12px;padding:8px 12px;font-size:13px;font-weight:700;margin:5px 6px 0 0}
.sechead{font-size:13px;font-weight:800;color:var(--mut);margin:18px 4px 6px;letter-spacing:.5px}
.empty{text-align:center;color:var(--mut);margin-top:44px;font-size:14.5px;line-height:1.9}
.empty .ic{font-size:40px}
.fab{position:fixed;right:calc(15px + env(safe-area-inset-right));bottom:calc(90px + env(safe-area-inset-bottom));
background:var(--gold);color:#3a2a00;border-radius:99px;padding:12px 16px;font-weight:800;font-size:13.5px;box-shadow:0 6px 18px rgba(230,150,15,.45);z-index:25;display:none;align-items:center;gap:6px;min-height:44px}
.sheet{position:fixed;inset:0;z-index:80;display:none;align-items:flex-end;justify-content:center;background:rgba(15,18,32,.4)}
.sheet.on{display:flex}
.sheet .box{background:var(--card);width:100%;max-width:540px;border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.2);animation:up .2s}
@keyframes up{from{transform:translateY(30px)}to{transform:translateY(0)}}
.sheet .w{font-size:26px;font-weight:800}.sheet .pos{color:var(--mut);font-size:13px;margin-left:6px}
.sheet .zh{font-size:17px;margin:6px 0 2px}
</style>
</head>
<body>
<div id="app"></div>
<button class="fab" id="fab" aria-label="生字複習"></button>
<div class="sheet" id="sheet"><div class="box" id="sheetbox"></div></div>
<div class="tabbar" id="tabbar" style="display:none"></div>
<div class="toast" id="toast" role="status"></div>
<script>/*__DATA__*/</script>
<script>
"use strict";
/* ===== 解密（密碼=AES-256-GCM 金鑰） ===== */
function b64buf(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
async function deriveKey(pw,saltB64,iter){var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64buf(saltB64),iterations:iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);}
async function decryptData(pw){var E=window.ENC,key=await deriveKey(pw,E.salt,E.iter);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64buf(E.iv)},key,b64buf(E.ct));return JSON.parse(new TextDecoder().decode(pt));}

/* ===== 狀態 ===== */
var DB=null,LS=localStorage,SK='gkq_v2';
function load(){try{return JSON.parse(LS.getItem(SK))||{}}catch(e){return{}}}
function save(){try{LS.setItem(SK,JSON.stringify(S))}catch(e){toast('儲存空間已滿，部分進度可能未存')}}
var S=load();
S.wrong=S.wrong||{};S.done=S.done||{};S.read=S.read||{};S.stat=S.stat||{ans:0,ok:0};
S.vocab=S.vocab||{};S.days=S.days||{};S.streak=S.streak||0;S.lastDay=S.lastDay||'';
S.first=S.first||{};S.us=S.us||{};S.goal=S.goal||20;
/* 忍者修行：跨App共用經驗錢包(同網域，灌進火影修行計畫) */
const NINJA_APP='jeng';
window.Ninja=window.Ninja||(function(){var K='ninja_xp_v1';function L(){try{return JSON.parse(localStorage.getItem(K))||{}}catch(e){return{}}}function G(){var w=L();w.xp=w.xp||0;w.bySrc=w.bySrc||{};w.correct=w.correct||0;w.units=w.units||0;w.jutsu=w.jutsu||[];w.seen=w.seen||{};return w}function P(w){w.ts=Date.now();try{localStorage.setItem(K,JSON.stringify(w))}catch(e){}}return{get:G,gain:function(n,a,o){o=o||{};var w=G();w.xp+=n;w.bySrc[a]=(w.bySrc[a]||0)+n;w.correct+=(o.correct||0);w.units+=(o.unit||0);P(w);return w},backfill:function(a,x,o){var w=G();if(w.seen[a])return w;o=o||{};w.xp+=x;w.bySrc[a]=(w.bySrc[a]||0)+x;w.correct+=(o.correct||0);w.units+=(o.unit||0);w.seen[a]=1;P(w);return w}}})();
(function(){try{Ninja.backfill(NINJA_APP,(S.stat.ok||0)*10,{correct:S.stat.ok||0});}catch(e){}})();
var app=document.getElementById('app'),tabbar=document.getElementById('tabbar'),fab=document.getElementById('fab'),
    sheet=document.getElementById('sheet'),sheetbox=document.getElementById('sheetbox');
function esc(t){return(t==null?'':''+t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function escAttr(t){return(t==null?'':''+t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(t){var e=document.getElementById('toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),1700)}
function speak(t){try{var u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function pctOf(a,b){return b?Math.round(a/b*100):0}
function today(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function dstr(off){var d=new Date(Date.now()+off*864e5);return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function recordDay(){var t=today();if(S.lastDay!==t){S.streak=(S.lastDay===dstr(-1))?S.streak+1:1;S.lastDay=t}S.days[t]=(S.days[t]||0)+1}

/* ===== 生字：點字彈窗（顯示中文，不誤加） ===== */
function dictOf(w){return (DB.dict&&DB.dict[w])||null}
function openWord(w,disp){var d=dictOf(w),inbook=!!S.vocab[w];
  sheetbox.innerHTML='<div><span class="w">'+esc(disp||w)+'</span>'+(d&&d.pos?'<span class="pos">'+esc(d.pos)+'</span>':'')+'</div>'
    +'<div class="zh">'+(d&&d.zh?esc(d.zh):'<span class="muted">（小字典無此字，可自行加入後補中文）</span>')+'</div>'
    +'<div style="display:flex;gap:10px;margin-top:14px">'
    +'<button class="btn ghost sm" style="flex:1" data-speak="'+escAttr(disp||w)+'" aria-label="發音">🔊 發音</button>'
    +'<button class="btn sm" style="flex:1" data-addv="'+escAttr(w)+'" data-vd="'+escAttr(disp||w)+'">'+(inbook?'✓ 已在生字本':'⭐ 加入生字本')+'</button></div>';
  sheet.classList.add('on');
}
function closeSheet(){sheet.classList.remove('on')}
sheet.addEventListener('click',e=>{if(e.target===sheet)closeSheet()});
function addVocab(word,disp){if(!word)return;var v=S.vocab[word];
  if(v){v.n=(v.n||1)+1}else{var d=dictOf(word);S.vocab[word]={n:1,disp:disp||word,zh:(d&&d.zh)||'',reps:0}}
  save();toast('已加入生字本：'+(disp||word)+' ⭐');refreshFab();
  document.querySelectorAll('.wd[data-w="'+word+'"]').forEach(el=>el.classList.add('saved'));closeSheet();}
/* 事件委派：點字、發音、加入、刪除 */
document.addEventListener('click',function(e){
  var wd=e.target.closest('.wd');if(wd){e.preventDefault();openWord(wd.dataset.w,wd.dataset.d);return;}
  var sp=e.target.closest('[data-speak]');if(sp){e.preventDefault();speak(sp.dataset.speak);return;}
  var av=e.target.closest('[data-addv]');if(av){e.preventDefault();addVocab(av.dataset.addv,av.dataset.vd);return;}
  var dl=e.target.closest('[data-del]');if(dl){e.preventDefault();delVocab(dl.dataset.del);return;}
},false);
document.addEventListener('keydown',function(e){var wd=e.target.closest&&e.target.closest('.wd');
  if(wd&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openWord(wd.dataset.w,wd.dataset.d);}});

/* ===== 分詞（在「原始文字」上處理，安全 esc） ===== */
function wrapWords(raw){raw=raw==null?'':''+raw;var re=/[A-Za-z][A-Za-z'’-]{2,}/g,out='',last=0,m;
  while((m=re.exec(raw))){out+=esc(raw.slice(last,m.index));var w=m[0],key=w.toLowerCase().replace(/[^a-z]/g,'');
    out+='<span class="wd'+(S.vocab[key]?' saved':'')+'" role="button" tabindex="0" data-w="'+escAttr(key)+'" data-d="'+escAttr(w)+'">'+esc(w)+'</span>';
    last=m.index+w.length;}
  out+=esc(raw.slice(last));return out;}

/* ===== 導覽 ===== */
function go(v){nav.push(view.cur);view.cur=v;paint()}
function back(){view.cur=nav.length?nav.pop():null;paint()}
function setTab(t){if(view.tab!==t)nav=[];view.tab=t;view.cur=null;paint()}
var view={tab:'home',cur:null},nav=[];
function cats(){return view.tab==='reading'?DB.reading:DB.grammar}
function findSeries(k){return DB.grammar.concat(DB.reading).find(c=>c.key===k)}
function catOf(k){return DB.grammar.some(c=>c.key===k)?'grammar':'reading'}
function topBar(title,showBack){return '<div class="top">'+(showBack?'<button class="back iconbtn" id="bk" aria-label="返回">‹</button>':'')+'<h2>'+esc(title)+'</h2></div>'}
function bindBack(){var b=document.getElementById('bk');if(b)b.onclick=back}
function catStats(list){var t=0,d=0;list.forEach(c=>c.units.forEach(u=>u.qids.forEach(id=>{t++;if(S.done[id])d++})));return[d,t]}
function seriesDone(c){var t=0,d=0;c.units.forEach(u=>u.qids.forEach(id=>{t++;if(S.done[id])d++}));return[d,t]}

/* ===== 弱點診斷 ===== */
function weakUnits(){var arr=[];for(var key in S.us){var u=S.us[key];if(u.a>=4){arr.push({key:key,acc:u.o/u.a,a:u.a,kn:u.kn,un:u.un,k:u.k,uk:u.uk,tab:u.tab})}}
  arr.sort((x,y)=>x.acc-y.acc);return arr.filter(x=>x.acc<0.8).slice(0,3);}
function weeklyReport(){var g=catStats(DB.grammar),r=catStats(DB.reading),wk=0;
  for(var i=0;i<7;i++)wk+=S.days[dstr(-i)]||0;
  var weak=weakUnits().map(x=>x.un+' '+Math.round(x.acc*100)+'%').join('、')||'—';
  return['📊 國中英文題庫 · 學習週報 ('+today()+')',
    '🔥 連續 '+S.streak+' 天 ｜ 近 7 天練 '+wk+' 題',
    '✅ 首答正確率 '+pctOf(S.stat.ok,S.stat.ans)+'%（首答 '+S.stat.ans+' 題）',
    '📗 文法 '+g[0]+'/'+g[1]+' 題 ｜ 📘 閱讀 '+r[0]+'/'+r[1]+' 題',
    '🎯 最需加強：'+weak,
    '⭐ 生字本 '+Object.keys(S.vocab).length+' 個 ｜ 錯題待複習 '+Object.keys(S.wrong).length+' 題'].join('\n');}

var quiz=null;
function qDiff(id){return +(DB.Q[id].diff||2)}
function startQuiz(k,uk,mode,diff){var c=findSeries(k),u=c.units.find(x=>x.key===uk);if(!u){toast('找不到單元');return}
  var ids=u.qids.slice();if(mode==='undone')ids=ids.filter(id=>!S.done[id]);
  if(diff&&diff!=='all')ids=ids.filter(id=>qDiff(id)===+diff);
  ids.sort((a,b)=>qDiff(a)-qDiff(b)); // 由易到難
  if(!ids.length){toast('沒有符合的題目');return}
  quiz={ids:ids,i:0,k:k,uk:uk,kn:c.name,un:u.name,tab:catOf(k),ok:0,src:'unit'};view.cur=null;go({t:'quiz'});}

function startWrong(list,title){if(!list.length){toast('沒有待複習');return}quiz={ids:list.slice(),i:0,un:title,ok:0,src:'wrong'};go({t:'quiz'});}
function quizView(){if(quiz.i>=quiz.ids.length)return scoreView();
  var q=DB.Q[quiz.ids[quiz.i]];
  var html=topBar((quiz.un||'複習')+'  '+(quiz.i+1)+'/'+quiz.ids.length,true);
  html+='<div class="prog"><i style="width:'+pctOf(quiz.i,quiz.ids.length)+'%"></i></div><div class="card">';
  if(q.pid&&DB.P[q.pid])html+='<div class="psg">'+wrapWords(DB.P[q.pid].text)+'</div>';
  html+='<div class="stem">'+wrapWords(q.stem)+'</div><div id="opts">';
  q.options.forEach((o,i)=>{html+='<button class="opt" data-pick="'+i+'"><span class="k">'+'ABCD'[i]+'</span>'+esc(o)+'</button>';});
  html+='</div><div id="fb"></div></div>';
  app.innerHTML=html;bindBack();
  document.querySelectorAll('#opts .opt').forEach(el=>el.onclick=()=>answer(+el.dataset.pick));}
function answer(pick){var q=DB.Q[quiz.ids[quiz.i]],correct=q.answer,right=pick===correct;
  document.querySelectorAll('#opts .opt').forEach((el,i)=>{el.onclick=null;if(i===correct)el.classList.add('ok');else if(i===pick)el.classList.add('bad');});
  recordDay();
  var firstTime=!S.first[q.id];
  if(firstTime){S.first[q.id]=1;S.stat.ans++;if(right){S.stat.ok++;Ninja.gain(10,NINJA_APP,{correct:1});}
    if(quiz.src==='unit'){var uk=quiz.tab+'|'+quiz.k+'|'+quiz.uk,us=S.us[uk]||{a:0,o:0};us.a++;if(right)us.o++;
      us.kn=quiz.kn;us.un=quiz.un;us.tab=quiz.tab;us.k=quiz.k;us.uk=quiz.uk;S.us[uk]=us;}}
  if(right){S.done[q.id]=1;
    if(S.wrong[q.id]){var w=S.wrong[q.id];w.days=w.days||[];var t=today();if(w.days.indexOf(t)<0)w.days.push(t);
      var IV=[1,3,7];w.ivl=Math.min((w.ivl||0)+1,IV.length-1);w.due=dstr(IV[w.ivl]); // 間隔加長
      if(w.days.length>=2)delete S.wrong[q.id];}} // 需跨兩日答對才畢業
  else{var w=S.wrong[q.id]||{days:[]};
    if(quiz.src==='unit'){w.tab=quiz.tab;w.k=quiz.k;w.uk=quiz.uk;w.kn=quiz.kn;w.un=quiz.un;}
    w.times=(w.times||0)+1;w.ivl=0;w.due=dstr(1);S.wrong[q.id]=w;} // 明天到期複習
  if(right)quiz.ok++;save();refreshFab();
  var fb=document.getElementById('fb');
  fb.innerHTML='<div class="exp"><b style="color:'+(right?'var(--ok)':'var(--bad)')+'">'+(right?'✅ 答對了！':'❌ 答錯，正解 '+'ABCD'[correct])+'</b>'
    +(q.exp?'<br>'+wrapWords(q.exp):'<br><span class="muted">（本題暫無詳解，可點題幹生字查中文）</span>')+'</div>'
    +'<button class="btn" style="margin-top:12px" id="nx">'+(quiz.i+1>=quiz.ids.length?'看結果':'下一題 →')+'</button>';
  document.getElementById('nx').onclick=()=>{quiz.i++;paint()};
  if(fb.scrollIntoView)fb.scrollIntoView({behavior:'smooth',block:'nearest'});}

/* ===== 模擬計時測驗 ===== */
var mock=null,mockTimer=null;
function poolIds(scope){var out=[];var src=scope==='grammar'?DB.grammar:scope==='reading'?DB.reading:DB.grammar.concat(DB.reading);
  src.forEach(c=>c.units.forEach(u=>u.qids.forEach(id=>out.push(id))));return out;}
function sample(arr,n){var a=arr.slice(),r=[];for(var i=0;i<n&&a.length;i++){var j=(i*2654435761+a.length*97+7)%a.length;r.push(a.splice(j,1)[0]);}return r;}
function mockCfgView(){var html=topBar('模擬測驗設定',true);
  var sc=view.mscope||'mixed',nn=view.mn||20;
  html+='<div class="card"><h3>範圍</h3><div class="seg" id="mscope">'+[['grammar','📗 文法'],['reading','📘 閱讀'],['mixed','混合']].map(x=>'<button data-s="'+x[0]+'" class="'+(sc===x[0]?'on':'')+'">'+x[1]+'</button>').join('')+'</div>'
    +'<h3 style="margin-top:14px">題數（每題約 1 分鐘）</h3><div class="seg" id="mn">'+[10,20,30].map(x=>'<button data-n="'+x+'" class="'+(nn===x?'on':'')+'">'+x+' 題</button>').join('')+'</div></div>'
    +'<button class="btn" id="mgo">開始測驗（'+nn+' 題 · 限時 '+nn+' 分）</button>';
  app.innerHTML=html;bindBack();
  app.querySelectorAll('#mscope button').forEach(b=>b.onclick=()=>{view.mscope=b.dataset.s;mockCfgView();});
  app.querySelectorAll('#mn button').forEach(b=>b.onclick=()=>{view.mn=+b.dataset.n;mockCfgView();});
  document.getElementById('mgo').onclick=()=>mockStart(sc,nn);}
function mockStart(scope,n){var ids=sample(poolIds(scope),n);if(ids.length<n)n=ids.length;
  mock={ids:ids,i:0,ans:new Array(ids.length).fill(-1),end:Date.now()+n*60000,scope:scope};
  if(mockTimer)clearInterval(mockTimer);
  mockTimer=setInterval(()=>{var el=document.getElementById('mtimer');
    var left=Math.max(0,Math.round((mock.end-Date.now())/1000));
    if(el)el.textContent=('0'+Math.floor(left/60)).slice(-2)+':'+('0'+(left%60)).slice(-2);
    if(left<=0){clearInterval(mockTimer);mockSubmit();}},1000);
  view.cur=null;go({t:'mock'});}
function mockView(){var q=DB.Q[mock.ids[mock.i]];
  var left=Math.max(0,Math.round((mock.end-Date.now())/1000));
  var html='<div class="top"><button class="back iconbtn" id="bk" aria-label="返回">‹</button><h2>模擬測驗</h2><span id="mtimer" style="font-weight:800;color:'+(left<60?'#ffd7d7':'#fff')+'">'+('0'+Math.floor(left/60)).slice(-2)+':'+('0'+(left%60)).slice(-2)+'</span></div>';
  html+='<div class="prog"><i style="width:'+pctOf(mock.i+1,mock.ids.length)+'%"></i></div>';
  html+='<div class="muted center" style="font-size:13px;margin:4px">第 '+(mock.i+1)+' / '+mock.ids.length+' 題 · 已答 '+mock.ans.filter(x=>x>=0).length+'</div>';
  html+='<div class="card">';
  if(q.pid&&DB.P[q.pid])html+='<div class="psg">'+wrapWords(DB.P[q.pid].text)+'</div>';
  html+='<div class="stem">'+wrapWords(q.stem)+'</div><div id="mopts">';
  q.options.forEach((o,i)=>{html+='<button class="opt'+(mock.ans[mock.i]===i?' ok':'')+'" data-mp="'+i+'"><span class="k">'+'ABCD'[i]+'</span>'+esc(o)+'</button>';});
  html+='</div></div>';
  html+='<div style="display:flex;gap:10px"><button class="btn ghost" id="mprev"'+(mock.i===0?' disabled style="opacity:.4"':'')+'>← 上一題</button>'
    +(mock.i+1>=mock.ids.length?'<button class="btn" id="msub">交卷</button>':'<button class="btn" id="mnext">下一題 →</button>')+'</div>';
  html+='<button class="btn ghost sm" id="msub2" style="width:100%;margin-top:10px">提前交卷</button>';
  app.innerHTML=html;
  document.getElementById('bk').onclick=()=>{if(confirm('離開會結束這次測驗，確定？')){if(mockTimer)clearInterval(mockTimer);back();}};
  app.querySelectorAll('#mopts .opt').forEach(el=>el.onclick=()=>{mock.ans[mock.i]=+el.dataset.mp;
    app.querySelectorAll('#mopts .opt').forEach(x=>x.classList.remove('ok'));el.classList.add('ok');});
  var pv=document.getElementById('mprev');if(pv)pv.onclick=()=>{if(mock.i>0){mock.i--;paint();}};
  var nx=document.getElementById('mnext');if(nx)nx.onclick=()=>{mock.i++;paint();};
  var sb=document.getElementById('msub'),sb2=document.getElementById('msub2');
  if(sb)sb.onclick=mockSubmit; if(sb2)sb2.onclick=()=>{if(confirm('確定交卷？'))mockSubmit();};}
function mockSubmit(){if(mockTimer)clearInterval(mockTimer);
  var ok=0;mock.ids.forEach((id,i)=>{if(mock.ans[i]===DB.Q[id].answer)ok++;});mock.score=ok;
  recordDay();save();view.cur={t:'mockresult'};paint();}
function mockResultView(){var n=mock.ids.length,pct=pctOf(mock.score,n);
  var html=topBar('測驗結果',false)+'<div class="card center"><div style="font-size:50px">'+(pct>=80?'🎉':pct>=50?'👍':'💪')+'</div>'
    +'<h2>'+mock.score+' / '+n+' 題（'+pct+'%）</h2><div class="prog" style="margin:12px 0"><i style="width:'+pct+'%"></i></div>'
    +'<div class="muted" style="font-size:13px">下方可逐題檢討，紅色為答錯</div></div>';
  mock.ids.forEach((id,i)=>{var q=DB.Q[id],my=mock.ans[i],right=my===q.answer;
    html+='<div class="card" style="border-left:4px solid '+(right?'var(--ok)':'var(--bad)')+'"><div class="s muted">第 '+(i+1)+' 題 '+(right?'✅':'❌')+'</div>'
      +(q.pid&&DB.P[q.pid]?'<div class="psg" style="font-size:14px">'+wrapWords(DB.P[q.pid].text)+'</div>':'')
      +'<div style="font-weight:700;margin:6px 0">'+wrapWords(q.stem)+'</div>';
    q.options.forEach((o,j)=>{var mk=j===q.answer?'✔ ':(j===my&&!right?'✘ ':'');
      html+='<div style="font-size:14px;color:'+(j===q.answer?'var(--ok)':(j===my&&!right?'var(--bad)':'var(--mut)'))+'">'+mk+'ABCD'[j]+'. '+esc(o)+'</div>';});
    if(q.exp)html+='<div class="exp" style="margin-top:8px">'+wrapWords(q.exp)+'</div>';
    html+='</div>';});
  html+='<button class="btn" id="mdone">完成</button>';
  app.innerHTML=html;document.getElementById('mdone').onclick=()=>setTab('home');}

/* ===== 生字造句練習（用得出） ===== */
var usq=null;
function reEsc(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
function usableVocab(){return Object.keys(S.vocab).filter(w=>{var d=DB.dict[w];return d&&d.eg&&new RegExp('\\b'+reEsc(w)+'\\b','i').test(d.eg);});}
function startUsage(){var list=usableVocab();if(list.length<1){toast('目前沒有可造句的生字（需字典有例句）');return}
  usq={list:sample(list,Math.min(10,list.length)),i:0};view.tab='review';nav=[];go({t:'usage'});}
function usageView(){if(usq.i>=usq.list.length){app.innerHTML=topBar('造句練習',false)+'<div class="card center"><div style="font-size:48px">🎉</div><h2>造句練習完成！</h2><button class="btn" id="ud">回複習</button></div>';document.getElementById('ud').onclick=()=>setTab('review');return;}
  var w=usq.list[usq.i],d=DB.dict[w];
  var blanked=d.eg.replace(new RegExp('\\b'+reEsc(w)+'\\b','i'),'______');
  var pool=Object.keys(DB.dict).filter(x=>x!==w&&DB.dict[x].pos===d.pos);if(pool.length<3)pool=Object.keys(DB.dict).filter(x=>x!==w);
  var opts=[w].concat(sample(pool,3));
  // 洗牌（固定式）
  for(var a=opts.length-1;a>0;a--){var b=(a*2654435761+usq.i*131+7)%(a+1);var t=opts[a];opts[a]=opts[b];opts[b]=t;}
  var ans=opts.indexOf(w);
  var html=topBar('生字造句  '+(usq.i+1)+'/'+usq.list.length,true);
  html+='<div class="card"><div class="s muted">選出最適合填入空格的字</div><div class="stem" style="margin:8px 0">'+esc(blanked)+'</div>'
    +'<div class="muted" style="font-size:13px;margin-bottom:8px">'+esc(d.egZh||'')+'</div><div id="uopts">';
  opts.forEach((o,i)=>{html+='<button class="opt" data-u="'+i+'"><span class="k">'+'ABCD'[i]+'</span>'+esc(o)+'</button>';});
  html+='</div><div id="ufb"></div></div>';
  app.innerHTML=html;bindBack();
  app.querySelectorAll('#uopts .opt').forEach(el=>el.onclick=()=>usageAns(+el.dataset.u,ans,w,d));}
function usageAns(pick,ans,w,d){var right=pick===ans;
  app.querySelectorAll('#uopts .opt').forEach((el,i)=>{el.onclick=null;if(i===ans)el.classList.add('ok');else if(i===pick)el.classList.add('bad');});
  recordDay();if(right){var v=S.vocab[w];if(v){v.reps=Math.max(v.reps||0,2);}}save();
  var fb=document.getElementById('ufb');
  fb.innerHTML='<div class="exp"><b style="color:'+(right?'var(--ok)':'var(--bad)')+'">'+(right?'✅ 正確！':'❌ 正解：'+w)+'</b><br>'+esc(d.eg)+'<br><span class="muted">'+esc(d.egZh||'')+'</span></div>'
    +'<button class="btn" style="margin-top:12px" id="unx">'+(usq.i+1>=usq.list.length?'完成':'下一題 →')+'</button>';
  document.getElementById('unx').onclick=()=>{usq.i++;paint();};}

      if(navigator.clipboard)navigator.clipboard.writeText(txt).then(()=>toast('已複製 ✓'),()=>toast('請長按文字複製'));else{try{document.execCommand('copy');toast('已複製 ✓')}catch(e){toast('請長按文字複製')}}};};
  document.getElementById('lock').onclick=()=>{LS.removeItem('gkq_pw');renderGate();};

function refreshFab(){var n=Object.keys(S.vocab).filter(w=>(S.vocab[w].reps||0)<2).length;

function paint(){window.scrollTo(0,0);var v=view.cur;
  if(mockTimer&&!(v&&v.t==='mock')){clearInterval(mockTimer);mockTimer=null;} // 離開模擬卷即停錶
  if(view.tab==='home'&&!v)dashView();
  else if(view.tab==='review'&&!v)reviewView();

  else if(!v)homeList();
  else if(v.t==='series')seriesView(v.k);else if(v.t==='unit')unitView(v.k,v.u);
  else if(v.t==='note')noteView(v.u);else if(v.t==='psg')psgView(v.k,v.u);

  else if(v.t==='mockcfg')mockCfgView();else if(v.t==='mock')mockView();
  else if(v.t==='mockresult')mockResultView();else if(v.t==='usage')usageView();
  syncTab();refreshFab();}
function syncTab(){[...tabbar.children].forEach(b=>b.classList.toggle('on',b.dataset.t===view.tab));}

/* ===== 密碼閘 ===== */
function renderGate(msg){tabbar.style.display='none';fab.style.display='none';
  app.innerHTML='<div class="gate"><div class="lockbadge">🔒</div><h2 class="center">國中英文題庫 · 內部版</h2>'
    +'<p class="center muted" style="font-size:14px">題庫資料已加密，僅供內部複習使用。</p>'
    +'<div class="card"><input type="password" id="pw" placeholder="請輸入通行密碼" autocomplete="off" inputmode="numeric">'
    +'<label class="ck"><input type="checkbox" id="rm" checked>記住登入（本裝置）</label>'
    +'<button class="btn" id="go">進入</button><p class="muted center" id="err" style="font-size:13px;min-height:18px">'+(msg||'')+'</p></div></div>';
  var inp=document.getElementById('pw'),gob=document.getElementById('go');
  async function tryin(){gob.disabled=true;document.getElementById('err').textContent='解密中…';
    try{DB=await decryptData(inp.value);if(document.getElementById('rm').checked)LS.setItem('gkq_pw',inp.value);boot();}
    catch(e){gob.disabled=false;document.getElementById('err').textContent='密碼不正確';inp.select();}}
  gob.onclick=tryin;inp.addEventListener('keydown',e=>{if(e.key==='Enter')tryin()});inp.focus();}
async function autoUnlock(){var pw=LS.getItem('gkq_pw');if(!pw){renderGate();return;}
  try{DB=await decryptData(pw);boot();}catch(e){LS.removeItem('gkq_pw');renderGate();}}
function boot(){tabbar.style.display='flex';
  tabbar.innerHTML=[['home','🏠','首頁'],['grammar','📗','文法'],['reading','📘','閱讀'],['review','📝','複習'],['settings','⚙️','設定']]
    .map(x=>'<button data-t="'+x[0]+'" aria-label="'+x[2]+'"><span class="ic">'+x[1]+'</span>'+x[2]+'</button>').join('');
  [...tabbar.children].forEach(b=>b.onclick=()=>setTab(b.dataset.t));
  view={tab:'home',cur:null};nav=[];paint();}
window.startVocab=startVocab;window.view=view;

if(!('crypto'in window&&crypto.subtle)){app.innerHTML='<div class="gate"><div class="lockbadge">⚠️</div><p class="center">此瀏覽器不支援解密（需 https 或較新瀏覽器）。<br>請用 Chrome/Edge，或透過「啟動手機版.bat」以網址開啟。</p></div>';}
else{autoUnlock();}
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>

<script>
(function(){
  function mount(){
    var f=document.getElementById('rdgFoot'); if(!f) return;
    // 找最合適的捲動容器：優先文件流的 #app，其次頁面最大的內部捲動區，最後 body
    var app=document.getElementById('app');
    var target=null;
    if(app){ var s=getComputedStyle(app); if(s.overflowY==='visible'||s.overflowY==='') target=app; }
    if(!target){
      var best=null,area=0,els=document.body.getElementsByTagName('*');
      for(var i=0;i<els.length;i++){ var el=els[i];
        if(el===f||el.contains(f)) continue;
        var st=getComputedStyle(el);
        if(st.overflowY==='auto'||st.overflowY==='scroll'){
          var r=el.getBoundingClientRect();
          if(r.height>200&&r.width>140&&r.top<innerHeight&&r.bottom>0){
            var a=r.width*r.height; if(a>area){area=a;best=el;}
          }
        }
      }
      target=best||app||document.body;
    }
    try{ target.appendChild(f); }catch(e){ document.body.appendChild(f); }
    f.style.display='block';
  }
  if(document.readyState==='complete') setTimeout(mount,300);
  else window.addEventListener('load',function(){setTimeout(mount,300);});
})();
</script>

<script>
(function(){
  var wrap=document.getElementById('rdgInstall'),btn=document.getElementById('rdgInstallBtn'),
      ios=document.getElementById('rdgIos'),iosClose=document.getElementById('rdgIosClose');
  if(!wrap||!btn)return;
  var dp=null,want=false;
  var standalone=(window.matchMedia&&matchMedia('(display-mode:standalone)').matches)||navigator.standalone===true;
  var isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  function mount(){
    var f=document.getElementById('rdgFoot');
    if(f){ if(wrap.parentNode!==f) f.insertBefore(wrap,f.firstChild); wrap.classList.remove('rdg-fixed'); }
    else { if(wrap.parentNode!==document.body) document.body.appendChild(wrap); wrap.classList.add('rdg-fixed'); }
  }
  function refresh(){
    if(standalone){wrap.style.display='none';return;}
    if(want){ mount(); wrap.style.display='block'; }
  }
  window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();dp=e;want=true;refresh();});
  window.addEventListener('appinstalled',function(){want=false;wrap.style.display='none';dp=null;});
  btn.addEventListener('click',function(){
    if(dp){
      dp.prompt();
      var c=dp.userChoice; dp=null; want=false;
      function hide(){wrap.style.display='none';}
      if(c&&c.then){c.then(hide,hide);} else {hide();}
    } else if(ios){ ios.classList.add('open'); }
  });
  iosClose&&iosClose.addEventListener('click',function(){ios.classList.remove('open');});
  ios&&ios.addEventListener('click',function(e){if(e.target===ios)ios.classList.remove('open');});
  if(isIOS){ want=true; }               // iOS 無 beforeinstallprompt → 直接給按鈕＋引導
  function later(){ setTimeout(refresh,700); }
  if(document.readyState==='complete') later(); else window.addEventListener('load',later);
})();
</script>

<script>/*ENG_SYNC_MODULE_V2*/
window.__ENG_APP="junior-qbank";window.__ENG_LABEL="國中英文題庫";
window.__ENG_SUMMARY=function(){
  var S={}; try{S=JSON.parse(localStorage.getItem('gkq_v2')||'{}')}catch(e){}
  var done=Object.keys(S.done||{}).length;
  var wa=Object.keys(S.wrong||{}).length;
  var stat=S.stat||{};
  var acc = stat.ans? Math.round((stat.ok||0)/stat.ans*100) : null;
  return {pct: acc, pctLabel:'總正確率',
    streak: S.streak||0,
    metrics:[{k:'答對題數',v:done},{k:'累積作答',v:stat.ans||0},{k:'待清錯題',v:wa}]};
};
(function(){
  var APP=window.__ENG_APP||'app', LABEL=window.__ENG_LABEL||document.title;
  var K={url:'eng_sync_url',key:'eng_sync_key',child:'eng_child'};
  function G(k){ try{return localStorage.getItem(k)||''}catch(e){return ''} }
  function cfg(){ return {url:G(K.url), key:G(K.key), child:G(K.child)}; }
  function ready(){ var c=cfg(); return !!(c.url&&c.child); }
  try{
    var m=(location.hash||'').match(/sync=(.+)$/);
    if(m){
      var p=m[1].split('~').map(function(s){try{return decodeURIComponent(s)}catch(e){return s}});
      if(p[0]) localStorage.setItem(K.url,p[0].replace(/\/+$/,''));
      if(p[1]) localStorage.setItem(K.key,p[1]);
      if(p[2]) localStorage.setItem(K.child,p[2]);
      try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
      setTimeout(function(){ alert('✅ 家長後台已設定：這台是「'+(p[2]||'')+'」的裝置，之後所有英語 App 都會自動回報進度。'); },300);
    }
  }catch(e){}
  function report(){ try{ return window.__ENG_SUMMARY()||{}; }catch(e){ return {}; } }
  var t=null;
  function push(beacon){
    var c=cfg(); if(!c.url||!c.child) return;
    var r=report();
    var body=JSON.stringify({child:c.child, app:APP, label:LABEL, key:c.key, ts:Date.now(),
      pct:(r.pct===undefined?null:r.pct), pctLabel:r.pctLabel||'進度',
      streak:(r.streak===undefined?null:r.streak), metrics:r.metrics||[]});
    var url=c.url+'/report';
    try{
      if(beacon && navigator.sendBeacon){ navigator.sendBeacon(url, new Blob([body],{type:'text/plain'})); return; }
      fetch(url,{method:'POST',headers:{'Content-Type':'text/plain'},body:body,keepalive:true})
        .then(function(){setDot(true)}).catch(function(){setDot(false)});
    }catch(e){}
  }
  function schedule(){ if(!ready()) return; if(t) clearTimeout(t); t=setTimeout(function(){push(false)},6000); }
  try{
    var _si=Storage.prototype.setItem;
    Storage.prototype.setItem=function(k,v){
      var r=_si.apply(this,arguments);
      try{ var s=String(k); if(s!=='eng_sync_url'&&s!=='eng_sync_key'&&s!=='eng_child') schedule(); }catch(e){}
      return r;
    };
  }catch(e){}
  window.addEventListener('pagehide',function(){ if(ready()) push(true); });
  document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='hidden'&&ready()) push(true); });
  function setDot(ok){ var d=document.getElementById('engSyncDot'); if(d) d.style.background=ok?'#2eb872':'#e8504f'; }
  window.engSyncNow=function(){ push(false); };
  window.engSync={push:push,cfg:cfg,report:report};
  setTimeout(function(){
    if(!ready()) return;
    if(document.getElementById('engSyncBadge')) return;
    var c=cfg();
    var b=document.createElement('div'); b.id='engSyncBadge';
    b.style.cssText='position:fixed;left:8px;bottom:calc(var(--nav-h,60px) + env(safe-area-inset-bottom) + 8px);z-index:60;background:rgba(0,0,0,.6);color:#fff;font-size:11px;padding:3px 9px;border-radius:999px;display:flex;align-items:center;gap:5px;cursor:pointer';
    b.innerHTML='<span id="engSyncDot" style="width:8px;height:8px;border-radius:50%;background:#2eb872;display:inline-block"></span>☁️ '+c.child;
    b.title='點我立即同步'; b.onclick=function(){ engSyncNow(); };
    document.body.appendChild(b);
    push(false);
  }, 900);
})();
</script>
